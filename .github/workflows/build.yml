name: Build Acoustic Twin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: Antrenare + Web (Optimizat pentru Python 3.12)
  train-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python Packages (Python 3.12 Compatible)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # ✅ VERSIUNI COMPATIBILE CU PYTHON 3.12
          pip install numpy==1.26.4 librosa==0.10.2.post1 soundfile==0.12.1
          pip install tensorflow==2.17.1
          
          python -c "import tensorflow as tf; print('✅ TF OK:', tf.__version__)"
          python -c "import librosa; print('✅ Librosa OK')"

      - name: Train & Export Model
        run: |
          echo "🚀 Starting training..."
          python train.py --epochs 10
          echo "🚀 Exporting weights..."
          python export_web.py
          
          mkdir -p web-artifacts
          cp weights.js web-artifacts/weights.js
          if [ -f index.html ]; then 
            cp index.html web-artifacts/index.html
          else 
            echo "⚠️ Warning: index.html not found"
          fi

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-files
          path: web-artifacts/

  # JOB 2: Deploy Pages
  deploy-pages:
    needs: train-and-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web Files
        uses: actions/download-artifact@v4
        with:
          name: web-files
          path: ./web-deploy
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 3: APK (Doar dacă există pubspec.yaml)
  build-apk:
    needs: train-and-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Flutter Project
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "flutter_exists=true" >> $GITHUB_OUTPUT
          else
            echo "flutter_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Trained Weights
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-files
          path: ./assets/models
          
      - name: Prepare Baseline JSON
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          # ✅ FIX: Instalăm numpy DOAR pentru acest pas
          pip install numpy==1.26.4 --quiet
          
          mkdir -p assets/models
          python -c "
          import numpy as np, json, os
          baseline_path = 'models/baseline.npz'
          if os.path.exists(baseline_path):
              d = np.load(baseline_path)
              data = {'mu': float(d['mu']), 'sigma': float(d['sigma'])}
          else:
              data = {'mu': 0.0, 'sigma': 1.0}
          json.dump(data, open('assets/models/baseline.json', 'w'))
          print('✅ Baseline JSON generat:', data)
          "

      - name: Setup Flutter
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Scaffold Android Project
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          flutter create . --org com.example --project-name acoustic_twin --platforms android
          cp custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/acoustic_twin
          cp custom/MainActivity.kt android/app/src/main/kotlin/com/example/acoustic_twin/MainActivity.kt
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle

      - name: Build APK
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: flutter build apk --debug --no-tree-shake-icons --split-per-abi

      - name: Upload APK
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-twin-apk
          path: build/app/outputs/flutter-apk/
