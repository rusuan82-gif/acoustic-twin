name: Build Acoustic Twin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  train-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy==1.26.4 librosa==0.10.2.post1 soundfile==0.12.1
          pip install tensorflow==2.17.1

      - name: Train & Export Model
        run: |
          python train.py --epochs 10
          python export_web.py
          mkdir -p web-artifacts
          cp weights.js web-artifacts/weights.js
          if [ -f index.html ]; then cp index.html web-artifacts/index.html; fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-artifacts/

  deploy-pages:
    needs: train-and-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-aab:
    needs: train-and-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Flutter Project
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then echo "flutter_exists=true" >> $GITHUB_OUTPUT; else echo "flutter_exists=false" >> $GITHUB_OUTPUT; fi

      - name: Download Trained Weights
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./assets/models
          
      - name: Prepare Baseline JSON
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          pip install numpy==1.26.4 --quiet
          mkdir -p assets/models
          python -c "import numpy as np, json, os; d=np.load('models/baseline.npz') if os.path.exists('models/baseline.npz') else {'mu':0,'sigma':1}; json.dump({'mu':float(d['mu']),'sigma':float(d['sigma'])}, open('assets/models/baseline.json','w'))"

      - name: Setup Flutter
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Scaffold Android Project
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          # ✅ SETĂM PACKAGE NAME-UL CORECT: com.rusuan82.acoustictwin
          flutter create . --org com.rusuan82 --project-name acoustictwin --platforms android
          
          # Configurăm MainActivity în directorul corect
          mkdir -p android/app/src/main/kotlin/com/rusuan82/acoustictwin
          if [ -f "custom/MainActivity.kt" ]; then cp custom/MainActivity.kt android/app/src/main/kotlin/com/rusuan82/acoustictwin/MainActivity.kt; fi
          if [ -f "custom/AndroidManifest.xml" ]; then cp custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi

      - name: Setup Keystore and Generate Build Gradle
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          # 1. Generăm keystore
          keytool -genkey -v -keystore android/app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=AcousticTwin, OU=Dev, O=Dev, L=City, S=State, C=US"
          
          # 2. Generăm un build.gradle complet nou, corect configurat pentru AAB
          cat <<EOF > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) { flutterVersionCode = '1' }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) { flutterVersionName = '1.0' }

          android {
              namespace "com.rusuan82.acoustictwin"
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions { jvmTarget = '1.8' }

              sourceSets { main.java.srcDirs += 'src/main/kotlin' }

              defaultConfig {
                  applicationId "com.rusuan82.acoustictwin"
                  minSdkVersion 26
                  targetSdkVersion flutter.targetSdkVersion
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }

              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword "android"
                      keyAlias "upload"
                      keyPassword "android"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter { source '../..' }
          dependencies {}
          EOF

      - name: Build AAB (Android App Bundle)
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload AAB
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-twin-aab
          path: build/app/outputs/bundle/release/app-release.aab
