name: Build Acoustic Twin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: Antrenare + Web
  train-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python Packages (Python 3.12 Compatible)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy==1.26.4 librosa==0.10.2.post1 soundfile==0.12.1
          pip install tensorflow==2.17.1
          
          python -c "import tensorflow as tf; print('✅ TF OK:', tf.__version__)"
          python -c "import librosa; print('✅ Librosa OK')"

      - name: Train & Export Model
        run: |
          echo "🚀 Starting training..."
          python train.py --epochs 10
          echo "🚀 Exporting weights..."
          python export_web.py
          
          mkdir -p web-artifacts
          cp weights.js web-artifacts/weights.js
          if [ -f index.html ]; then 
            cp index.html web-artifacts/index.html
          else 
            echo "⚠️ Warning: index.html not found"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-artifacts/

  # JOB 2: Deploy Pages
  deploy-pages:
    needs: train-and-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 3: Build AAB (Android App Bundle pentru Google Play)
  build-aab:
    needs: train-and-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Flutter Project
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "flutter_exists=true" >> $GITHUB_OUTPUT
          else
            echo "flutter_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Trained Weights
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./assets/models
          
      - name: Prepare Baseline JSON
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          pip install numpy==1.26.4 --quiet
          mkdir -p assets/models
          python -c "
          import numpy as np, json, os
          baseline_path = 'models/baseline.npz'
          if os.path.exists(baseline_path):
              d = np.load(baseline_path)
              data = {'mu': float(d['mu']), 'sigma': float(d['sigma'])}
          else:
              data = {'mu': 0.0, 'sigma': 1.0}
          json.dump(data, open('assets/models/baseline.json', 'w'))
          print('✅ Baseline JSON generat:', data)
          "

      - name: Setup Flutter
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Scaffold Android Project
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          flutter create . --org com.example --project-name acoustic_twin --platforms android
          cp custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/acoustic_twin
          cp custom/MainActivity.kt android/app/src/main/kotlin/com/example/acoustic_twin/MainActivity.kt
          
          # Setăm minSdkVersion la 26
          sed -i 's/flutter\.minSdkVersion/26/g' android/app/build.gradle

      # ✅ PAS NOU: Generare Keystore pentru Semnare (Obligatoriu pentru AAB)
      - name: Setup Keystore for Signing
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          # Generăm un keystore temporar
          keytool -genkey -v -keystore android/app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=AcousticTwin, OU=Dev, O=Dev, L=City, S=State, C=US"
          
          # Creăm key.properties
          echo "storeFile=release-key.jks" >> android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties

      # ✅ PAS NOU: Configurare Gradle pentru Semnare
      - name: Configure Build Gradle for Signing
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          # Adăugăm signingConfigs în android/app/build.gradle
          # Folosim un script python pentru a modifica fișierul gradle în siguranță
          python3 << 'EOF'
          import re

          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          # Adăugăm signingConfigs după android {
          signing_config = '''
              signingConfigs {
                  release {
                      keyAlias project.findProperty("keyAlias") ?: "upload"
                      keyPassword project.findProperty("keyPassword") ?: "android"
                      storeFile file(project.findProperty("storeFile") ?: "release-key.jks")
                      storePassword project.findProperty("storePassword") ?: "android"
                  }
              }
          '''
          
          # Inserăm signingConfigs dacă nu există
          if 'signingConfigs' not in content:
              content = content.replace('android {', 'android {' + signing_config, 1)

          # Adăugăm signingConfig signingConfigs.release în buildTypes release
          if 'signingConfig signingConfigs.release' not in content:
              # Căutăm buildTypes { release { și adăugăm linia
              content = re.sub(
                  r'(buildTypes\s*{[^}]*release\s*{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  content
              )

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          
          print("✅ Gradle configurat pentru semnare")
          EOF

      # ✅ PAS MODIFICAT: Build AAB în loc de APK
      - name: Build AAB (Android App Bundle)
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: flutter build appbundle --release --no-tree-shake-icons

      # ✅ PAS MODIFICAT: Upload AAB
      - name: Upload AAB
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-twin-aab
          path: build/app/outputs/bundle/release/app-release.aab
