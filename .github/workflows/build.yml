name: Build Acoustic Twin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  train-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy==1.26.4 librosa==0.10.2.post1 soundfile==0.12.1 tensorflow==2.17.1
      - name: Train & Export Model
        run: |
          python train.py --epochs 10
          python export_web.py
          mkdir -p web-artifacts
          cp weights.js web-artifacts/weights.js
          [ -f index.html ] && cp index.html web-artifacts/index.html || echo "index.html missing"
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-artifacts/

  deploy-pages:
    needs: train-and-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-aab:
    needs: train-and-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check Flutter Project
        id: check_flutter
        run: |
          [ -f "pubspec.yaml" ] && echo "flutter_exists=true" >> $GITHUB_OUTPUT || echo "flutter_exists=false" >> $GITHUB_OUTPUT

      - name: Download Trained Weights
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./assets/models

      - name: Prepare Baseline JSON
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          pip install numpy==1.26.4 --quiet
          mkdir -p assets/models
          python -c "
          import numpy as np, json, os
          d = np.load('models/baseline.npz') if os.path.exists('models/baseline.npz') else None
          data = {'mu': float(d['mu']), 'sigma': float(d['sigma'])} if d else {'mu': 0.0, 'sigma': 1.0}
          json.dump(data, open('assets/models/baseline.json', 'w'))
          "

      - name: Setup Flutter
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Scaffold Android Project
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          flutter create . --org com.example --project-name acoustic_twin --platforms android
          if [ -f custom/AndroidManifest.xml ]; then cp custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi
          mkdir -p android/app/src/main/kotlin/com/example/acoustic_twin
          if [ -f custom/MainActivity.kt ]; then cp custom/MainActivity.kt android/app/src/main/kotlin/com/example/acoustic_twin/MainActivity.kt; fi

      # ✅ ÎNLOCUIEȘTE build.gradle cu versiunea noastră corectă (fără regex!)
      - name: Apply Custom Build Gradle
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          if [ -f custom/build.gradle ]; then
            cp custom/build.gradle android/app/build.gradle
            echo "✅ build.gradle personalizat aplicat"
          fi

      # ✅ Keystore: folosește-l pe cel din repo dacă există, altfel generează unul nou
      - name: Setup Keystore
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          if [ -f release-key.jks ]; then
            echo "✅ Folosim keystore-ul salvat în repo"
            cp release-key.jks android/app/release-key.jks
          else
            echo "⚠️ Prima rulare: generăm keystore nou"
            keytool -genkey -v -keystore android/app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=AcousticTwin, OU=Dev, O=Dev, L=City, S=State, C=US"
          fi
          echo "storeFile=release-key.jks" > android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties

      - name: Build AAB (Android App Bundle)
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload AAB
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-twin-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # ✅ Backup keystore ca să îl poți salva în repo pentru semnare consistentă
      - name: Upload Keystore Backup
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: android/app/release-key.jks
