name: Build Acoustic Twin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: Antrenare + Web (Ușor, ~3 min)
  train-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Python deps
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('train.py', 'export_web.py') }}

      - name: Setup Python & Train Model
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.24.4 librosa soundfile
          pip install tensorflow-cpu==2.15.0 --no-deps
          pip install keras==2.15.0 protobuf==3.20.3 h5py==3.10.0
          
          python train.py --epochs 10
          python export_web.py
          
          mkdir -p web-artifacts
          cp weights.js web-artifacts/weights.js
          cp index.html web-artifacts/index.html 2>/dev/null || true

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-files
          path: web-artifacts/

  # JOB 2: Deploy Pages
  deploy-pages:
    needs: train-and-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web Files
        uses: actions/download-artifact@v4
        with:
          name: web-files
          path: ./web-deploy
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-deploy
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 3: APK (Doar dacă există pubspec.yaml)
  build-apk:
    needs: train-and-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Check if Flutter project exists
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "flutter_exists=true" >> $GITHUB_OUTPUT
          else
            echo "flutter_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Trained Weights
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-files
          path: ./assets/models
          
      - name: Prepare Baseline JSON for Flutter
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          mkdir -p assets/models
          python -c "
          import numpy as np, json, os
          baseline_path = 'models/baseline.npz'
          if os.path.exists(baseline_path):
              d = np.load(baseline_path)
              data = {'mu': float(d['mu']), 'sigma': float(d['sigma'])}
          else:
              data = {'mu': 0.0, 'sigma': 1.0}
          json.dump(data, open('assets/models/baseline.json', 'w'))
          "

      - name: Cache Flutter
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/cache@v3
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.22.3

      - name: Setup Flutter
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Scaffold Android Project
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          flutter create . --org com.example --project-name acoustic_twin --platforms android
          cp custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/acoustic_twin
          cp custom/MainActivity.kt android/app/src/main/kotlin/com/example/acoustic_twin/MainActivity.kt
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle

      - name: Build APK (Optimized)
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: flutter build apk --debug --no-tree-shake-icons --split-per-abi

      - name: Upload APK
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-twin-apk
          path: build/app/outputs/flutter-apk/
