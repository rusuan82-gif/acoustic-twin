<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acoustic Twin // LCARS Diagnostic Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --lcars-blue: #99ccff;
            --lcars-orange: #ff9900;
            --lcars-red: #cc0000;
            --lcars-bg: #050505;
            --lcars-panel: #111;
            --scanline: rgba(153, 204, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--lcars-bg);
            color: var(--lcars-blue);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Efect Scanline CRT */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(to bottom, var(--scanline) 50%, transparent 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--lcars-panel);
            border: 2px solid var(--lcars-blue);
            border-radius: 15px 40px 15px 40px;
            padding: 30px;
            position: relative;
            z-index: 5;
            box-shadow: 0 0 20px rgba(153, 204, 255, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid var(--lcars-blue);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-bar { font-size: 0.8rem; color: var(--lcars-orange); }
        h1 { font-size: 1.5rem; text-shadow: 0 0 5px var(--lcars-blue); }

        .radar-container {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 2px solid var(--lcars-blue);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(153, 204, 255, 0.5) 100%);
            border-radius: 50%;
            animation: sweep 2s linear infinite;
            display: none;
        }

        @keyframes sweep { 100% { transform: rotate(360deg); } }

        .score-display { font-size: 3rem; font-weight: bold; z-index: 2; }

        .btn-main {
            display: block;
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--lcars-orange);
            color: var(--lcars-orange);
            font-family: inherit;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            border-radius: 5px 20px 5px 20px;
        }

        .btn-main:hover:not(:disabled) {
            background: var(--lcars-orange);
            color: var(--lcars-bg);
            box-shadow: 0 0 15px var(--lcars-orange);
        }

        .btn-main:disabled { border-color: #555; color: #555; cursor: not-allowed; }

        .report-panel {
            margin-top: 20px;
            border-top: 1px dashed var(--lcars-blue);
            padding-top: 15px;
            display: none;
        }

        .report-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .alert-high { color: var(--lcars-red); text-shadow: 0 0 5px var(--lcars-red); }
        .alert-med { color: var(--lcars-orange); }
        .alert-low { color: var(--lcars-blue); }

        .visualizer { width: 100%; height: 60px; background: #000; margin-top: 15px; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>ACOUSTIC TWIN v1.0</span>
        <span class="status-bar" id="sys-status">SYSTEM READY</span>
    </div>

    <div style="text-align: center;">
        <p>DIAGNOSTIC PREDICTIV HARDWARE</p>
    </div>

    <div class="radar-container">
        <div class="radar-sweep" id="radar"></div>
        <div class="score-display" id="score">--</div>
    </div>

    <canvas id="visualizer" class="visualizer"></canvas>

    <button id="scanBtn" class="btn-main">PORNEȘTE SCANAREA (6s)</button>

    <div class="report-panel" id="report">
        <h3 style="color: var(--lcars-orange); margin-bottom: 10px;">// RAPORT ANALIZĂ ACUSTICĂ</h3>
        <div id="report-content"></div>
    </div>
</div>

<script>
    const sysStatus = document.getElementById('sys-status');
    const scanBtn = document.getElementById('scanBtn');
    const scoreDisplay = document.getElementById('score');
    const radar = document.getElementById('radar');
    const reportPanel = document.getElementById('report');
    const reportContent = document.getElementById('report-content');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    // Inițializare Canvas
    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawIdleVisualizer();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Funcția principală de scanare
    scanBtn.addEventListener('click', async () => {
        scanBtn.disabled = true;
        scanBtn.innerText = "ASCULTARE ACTIVĂ...";
        radar.style.display = "block";
        reportPanel.style.display = "none";
        scoreDisplay.innerText = "...";
        scoreDisplay.style.color = "var(--lcars-blue)";
        sysStatus.innerText = "CAPTURING AUDIO STREAM...";

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // Configurăm AudioContext pentru analiză în timp real
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            let totalEnergy = 0;
            let sampleCount = 0;
            let animationId;

            // Funcție de analiză în buclă (6 secunde)
            function analyzeFrame() {
                analyser.getByteFrequencyData(dataArray);
                
                // Calculăm energia spectrală (simulează detectarea anomaliilor)
                let frameEnergy = 0;
                for(let i = 0; i < bufferLength; i++) {
                    frameEnergy += dataArray[i];
                }
                totalEnergy += frameEnergy;
                sampleCount++;

                // Desenăm vizualizatorul
                drawActiveVisualizer(dataArray);

                if (sampleCount < 180) { // ~6 secunde la 30fps
                    animationId = requestAnimationFrame(analyzeFrame);
                } else {
                    // Finalizare scanare
                    cancelAnimationFrame(animationId);
                    stream.getTracks().forEach(track => track.stop());
                    audioCtx.close();
                    
                    processResult(totalEnergy / sampleCount);
                }
            }

            analyzeFrame();

        } catch (err) {
            console.error(err);
            sysStatus.innerText = "ERR: MIC ACCESS DENIED";
            sysStatus.style.color = "var(--lcars-red)";
            scanBtn.disabled = false;
            scanBtn.innerText = "REÎNCERCARE";
            radar.style.display = "none";
        }
    });

    // Procesarea rezultatului și generarea raportului
    function processResult(avgEnergy) {
        sysStatus.innerText = "PROCESSING SPECTROGRAM...";
        radar.style.display = "none";
        
        // Algoritm de diagnosticare bazat pe energie spectrală
        // Energie mică = Liniște/Normal | Energie mare = Zgomot/Anomalie
        let health = 100;
        let anomalyScore = avgEnergy / 1000; // Normalizăm
        
        if (anomalyScore > 50) health = 40; // Zgomot puternic -> Critic
        else if (anomalyScore > 20) health = 70; // Zgomot mediu -> Atenție
        else health = 95; // Liniște -> Optim
        
        // Adăugăm o variație aleatorie pentru realism (simulează AI-ul)
        health = Math.max(0, Math.min(100, health + (Math.random() * 10 - 5)));
        health = Math.round(health);

        scoreDisplay.innerText = health + "%";
        generateReport(health, anomalyScore);

        sysStatus.innerText = "ANALYSIS COMPLETE";
        scanBtn.disabled = false;
        scanBtn.innerText = "SCANEAZĂ DIN NOU";
        drawIdleVisualizer();
    }

    // Logica Raportului de Diagnostic (Star Trek Style)
    function generateReport(health, anomalyScore) {
        reportPanel.style.display = "block";
        let html = "";
        
        if (health > 85) {
            scoreDisplay.style.color = "var(--lcars-blue)";
            html += `<div class="report-item alert-low"><span>STARE GENERALĂ:</span><span>OPTIMĂ</span></div>`;
            html += `<div class="report-item alert-low"><span>ANOMALII DETECTATE:</span><span>NESIGNIFICANT</span></div>`;
            html += `<div class="report-item alert-low"><span>ACȚIUNE:</span><span>MONITORIZARE STANDARD</span></div>`;
        } else if (health > 60) {
            scoreDisplay.style.color = "var(--lcars-orange)";
            html += `<div class="report-item alert-med"><span>STARE GENERALĂ:</span><span>ATENȚIE</span></div>`;
            html += `<div class="report-item alert-med"><span>SUSPECT 1:</span><span>RULMENT VENTILATOR (UZURĂ)</span></div>`;
            html += `<div class="report-item alert-med"><span>SEMNĂTURĂ:</span><span>FRECVENȚE TONALE 2-4kHz</span></div>`;
            html += `<div class="report-item alert-med"><span>ACȚIUNE:</span><span>INSPECȚIE ÎN 7 ZILE</span></div>`;
        } else {
            scoreDisplay.style.color = "var(--lcars-red)";
            html += `<div class="report-item alert-high"><span>STARE GENERALĂ:</span><span>CRITICĂ</span></div>`;
            html += `<div class="report-item alert-high"><span>SUSPECT 1:</span><span>HDD MECHANICAL FAILURE</span></div>`;
            html += `<div class="report-item alert-high"><span>SUSPECT 2:</span><span>COIL WHINE / PSU INSTABIL</span></div>`;
            html += `<div class="report-item alert-high"><span>SEMNĂTURĂ:</span><span>TRANZIENTE BRUȘTE / HIGH ENERGY</span></div>`;
            html += `<div class="report-item alert-high"><span>ACȚIUNE:</span><span>OPRIRE IMEDIATĂ / BACKUP</span></div>`;
        }
        
        reportContent.innerHTML = html;
    }

    // Vizualizator Audio
    function drawIdleVisualizer() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#99ccff";
        ctx.beginPath();
        ctx.moveTo(0, canvas.height/2);
        ctx.lineTo(canvas.width, canvas.height/2);
        ctx.stroke();
    }

    function drawActiveVisualizer(dataArray) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const barWidth = (canvas.width / dataArray.length) * 2.5;
        let x = 0;

        for(let i = 0; i < dataArray.length; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            
            // Culori dinamice în funcție de intensitate
            if(dataArray[i] > 200) ctx.fillStyle = "#cc0000";
            else if(dataArray[i] > 100) ctx.fillStyle = "#ff9900";
            else ctx.fillStyle = "#99ccff";
            
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 1;
        }
    }
</script>

</body>
</html>
